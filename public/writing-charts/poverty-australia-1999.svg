<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="system-ui, -apple-system, sans-serif">
  <rect width="760" height="400" fill="#ffffff" rx="12"/>
  <text x="380" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Proportion of Families Living in Poverty in Australia (1999)</text>
  <g transform="translate(50, 60)" font-size="13">
    <rect x="0" y="0" width="660" height="40" fill="#1e293b" rx="6"/>
    <text x="20" y="25" fill="#ffffff" font-weight="700">Family Type</text>
    <text x="480" y="25" fill="#ffffff" font-weight="700" text-anchor="middle">Proportion of Each Type in Poverty</text>
    
      <rect x="0" y="42" width="660" height="40" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="20" y="67" fill="#0f172a" font-weight="600">Single aged person</text>
      <text x="480" y="67" fill="#334155" font-weight="400" text-anchor="middle">6% (54,000)</text>
      <rect x="0" y="82" width="660" height="40" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="20" y="107" fill="#0f172a" font-weight="600">Aged couple</text>
      <text x="480" y="107" fill="#334155" font-weight="400" text-anchor="middle">4% (48,000)</text>
      <rect x="0" y="122" width="660" height="40" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="20" y="147" fill="#0f172a" font-weight="600">Single, no children</text>
      <text x="480" y="147" fill="#334155" font-weight="400" text-anchor="middle">19% (359,000)</text>
      <rect x="0" y="162" width="660" height="40" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="20" y="187" fill="#0f172a" font-weight="600">Couple, no children</text>
      <text x="480" y="187" fill="#334155" font-weight="400" text-anchor="middle">7% (211,000)</text>
      <rect x="0" y="202" width="660" height="40" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="20" y="227" fill="#0f172a" font-weight="600">Sole parent</text>
      <text x="480" y="227" fill="#334155" font-weight="400" text-anchor="middle">21% (232,000)</text>
      <rect x="0" y="242" width="660" height="40" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="20" y="267" fill="#0f172a" font-weight="600">Couple with children</text>
      <text x="480" y="267" fill="#334155" font-weight="400" text-anchor="middle">12% (933,000)</text>
      <rect x="0" y="282" width="660" height="40" fill="#eff6ff" stroke="#e2e8f0"/>
      <text x="20" y="307" fill="#0f172a" font-weight="700">All households</text>
      <text x="480" y="307" fill="#334155" font-weight="700" text-anchor="middle">11% (1,837,000)</text>
  </g>
</svg>