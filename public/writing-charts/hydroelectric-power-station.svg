<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="system-ui, -apple-system, sans-serif">
  <rect width="760" height="400" fill="#ffffff" rx="12"/>
  <text x="380" y="32" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Hydroelectric Power Station (Day &amp; Night Cycle)</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowNight" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Boxes -->
  <rect x="40" y="95" width="150" height="65" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="115" y="123" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">High-level Reservoir</text>
  <text x="115" y="142" text-anchor="middle" font-size="11" fill="#1e40af">(River + Dam)</text>

  <rect x="245" y="105" width="135" height="48" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="312" y="126" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Intake</text>
  <text x="312" y="142" text-anchor="middle" font-size="10" fill="#475569">Open: Day · Closed: Night</text>

  <rect x="440" y="185" width="150" height="58" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="515" y="210" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">Reversible Turbines</text>
  <text x="515" y="227" text-anchor="middle" font-size="10" fill="#b45309">(Generate / Pump)</text>

  <rect x="440" y="80" width="150" height="52" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="515" y="103" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">Generator</text>
  <text x="515" y="120" text-anchor="middle" font-size="10" fill="#166534">→ National Grid (Power lines)</text>

  <rect x="245" y="275" width="165" height="58" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="327" y="300" text-anchor="middle" font-size="12" font-weight="700" fill="#312e81">Low-level Reservoir</text>
  <text x="327" y="317" text-anchor="middle" font-size="10" fill="#3730a3">Collects water during day</text>

  <!-- Day flow -->
  <line x1="190" y1="128" x2="242" y2="128" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 380 128 L 415 128 L 415 214 L 436 214" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="515" y1="185" x2="515" y2="136" stroke="#16a34a" stroke-width="2.5"/>
  <path d="M 440 228 L 327 228 L 327 271" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Night pump-back -->
  <path d="M 410 304 L 515 304 L 515 247" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrowNight)"/>
  <path d="M 440 198 L 115 198 L 115 164" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrowNight)"/>

  <!-- Legend -->
  <g transform="translate(50, 360)" font-size="12" fill="#334155">
    <line x1="0" y1="0" x2="24" y2="0" stroke="#2563eb" stroke-width="2.5"/>
    <text x="32" y="4">Daytime flow (Generates electricity)</text>
    <line x1="290" y1="0" x2="314" y2="0" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5,4"/>
    <text x="322" y="4">Nighttime flow (Pumps water back to high-level reservoir)</text>
  </g>
</svg>