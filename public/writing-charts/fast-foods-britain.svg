<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="system-ui, -apple-system, sans-serif">
  <rect width="760" height="400" fill="#ffffff" rx="12"/>
  <text x="380" y="32" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Expenditure on Fast Foods by Income Group (Britain)</text>
  <text x="380" y="52" text-anchor="middle" font-size="12" fill="#64748b">Pence per person per week</text>
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="80" y1="80" x2="620" y2="80"/>
    <line x1="80" y1="136" x2="620" y2="136"/>
    <line x1="80" y1="192" x2="620" y2="192"/>
    <line x1="80" y1="248" x2="620" y2="248"/>
    <line x1="80" y1="304" x2="620" y2="304"/>
    <line x1="80" y1="340" x2="620" y2="340" stroke="#94a3b8"/>
  </g>
  <g font-size="11" fill="#475569" text-anchor="end">
    <text x="70" y="84">45p</text>
    <text x="70" y="140">35p</text>
    <text x="70" y="196">25p</text>
    <text x="70" y="252">15p</text>
    <text x="70" y="344">0p</text>
  </g>
  <!-- High: 43, 17, 18 | Average: 33, 24, 11 | Low: 14, 17, 7 -->
  <!-- Scale: 0p=340, 45p=80 => 5.78px per p -->
  <g>
    <!-- High income -->
    <rect x="115" y="91" width="34" height="249" fill="#2563eb" rx="3"/>
    <rect x="155" y="242" width="34" height="98" fill="#f59e0b" rx="3"/>
    <rect x="195" y="236" width="34" height="104" fill="#10b981" rx="3"/>
    <text x="172" y="362" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">High income</text>

    <!-- Average income -->
    <rect x="295" y="149" width="34" height="191" fill="#2563eb" rx="3"/>
    <rect x="335" y="201" width="34" height="139" fill="#f59e0b" rx="3"/>
    <rect x="375" y="276" width="34" height="64" fill="#10b981" rx="3"/>
    <text x="352" y="362" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">Average income</text>

    <!-- Low income -->
    <rect x="475" y="259" width="34" height="81" fill="#2563eb" rx="3"/>
    <rect x="515" y="242" width="34" height="98" fill="#f59e0b" rx="3"/>
    <rect x="555" y="300" width="34" height="40" fill="#10b981" rx="3"/>
    <text x="532" y="362" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">Low income</text>
  </g>
  <g transform="translate(640, 130)" font-size="12" fill="#1e293b">
    <rect x="0" y="0" width="14" height="14" rx="3" fill="#2563eb"/><text x="20" y="11">Hamburgers</text>
    <rect x="0" y="28" width="14" height="14" rx="3" fill="#f59e0b"/><text x="20" y="39">Fish &amp; chips</text>
    <rect x="0" y="56" width="14" height="14" rx="3" fill="#10b981"/><text x="20" y="67">Pizza</text>
  </g>
</svg>